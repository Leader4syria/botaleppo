{% extends 'base.html' %}

{% block content %}
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">إدارة الفئات</h1>
    </div>

    <div class="card">
        <div class="card-header">
            إضافة فئة جديدة
        </div>
        <div class="card-body">
            <form method="post" action="{{ url_for('add_category_route') }}">
                <div class="row g-3">
                    <div class="col-sm-6">
                        <label for="name" class="form-label">اسم الفئة</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="col-sm-6">
                        <label for="parent_id" class="form-label">الفئة الأب (اختياري)</label>
                        <select class="form-select" id="parent_id" name="parent_id">
                            <option value="">-- لا يوجد --</option>
                            {% for category in categories %}
                                <option value="{{ category.id }}">{{ category.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <button class="btn btn-primary mt-3" type="submit">إضافة الفئة</button>
            </form>
        </div>
    </div>

    <h2 class="mt-4">الفئات الحالية</h2>
    <div class="table-responsive">
        <table class="table table-striped table-sm table-hover">
            <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">الاسم</th>
                    <th scope="col">إجراءات</th>
                </tr>
            </thead>
            <tbody>
                {% for category in categories %}
                    <tr>
                        <td>{{ category.id }}</td>
                        <td>{{ category.name }}</td>
                        <td>
                            <!-- Note: Edit functionality can be re-added if needed, but keeping it simple for now -->
                            <a href="{{ url_for('delete_category_route', id=category.id) }}" class="btn btn-sm btn-outline-danger" onclick="return confirm('هل أنت متأكد؟')">حذف</a>
                        </td>
                    </tr>
                {% else %}
                    <tr>
                        <td colspan="3" class="text-center">لا توجد فئات لعرضها.</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
