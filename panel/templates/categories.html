{% extends 'base.html' %}

{% block content %}
    <h2>إدارة الأقسام</h2>

    <form method="post" action="{{ url_for('add_category_route') }}">
        <h3>إضافة قسم جديد</h3>
        <label for="name">اسم القسم:</label>
        <input type="text" id="name" name="name" required>
        <label for="parent_id">القسم الأب (اختياري):</label>
        <select id="parent_id" name="parent_id">
            <option value="">لا يوجد</option>
            {% for category in categories %}
                <option value="{{ category.id }}">{{ category.name }}</option>
            {% endfor %}
        </select>
        <button type="submit">إضافة</button>
    </form>

    <hr>

    <h3>الأقسام الحالية</h3>
    <ul>
        {% for category in categories %}
            <li>
                {{ category.name }}
                <a href="{{ url_for('edit_category_route', id=category.id) }}">تعديل</a>
                <a href="{{ url_for('delete_category_route', id=category.id) }}" onclick="return confirm('هل أنت متأكد؟')">حذف</a>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
