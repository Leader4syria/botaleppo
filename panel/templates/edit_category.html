{% extends 'base.html' %}

{% block content %}
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">تعديل القسم: {{ category.name }}</h1>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="post">
                <div class="mb-3">
                    <label for="name" class="form-label">اسم القسم</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ category.name }}" required>
                </div>
                <div class="mb-3">
                    <label for="parent_id" class="form-label">القسم الأب (اختياري)</label>
                    <select class="form-select" id="parent_id" name="parent_id">
                        <option value="">-- لا يوجد --</option>
                        {% for cat in all_categories %}
                            {% if cat.id != category.id %} {# A category cannot be its own parent #}
                            <option value="{{ cat.id }}" {% if cat.id == category.parent_id %}selected{% endif %}>{{ cat.name }}</option>
                            {% endif %}
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">حفظ التعديلات</button>
                <a href="{{ url_for('categories_route') }}" class="btn btn-secondary">إلغاء</a>
            </form>
        </div>
    </div>
{% endblock %}
