{% extends 'base.html' %}

{% block content %}
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">تعديل تكوين API: {{ config.api_name }}</h1>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="post">
                <div class="row g-3">
                    <div class="col-sm-6">
                        <label for="api_name" class="form-label">اسم الـ API</label>
                        <input type="text" class="form-control" id="api_name" name="api_name" value="{{ config.api_name }}" required>
                    </div>
                    <div class="col-sm-6">
                        <label for="base_url" class="form-label">عنوان URL الأساسي</label>
                        <input type="url" class="form-control" id="base_url" name="base_url" value="{{ config.base_url }}" required>
                    </div>
                    <!-- Token is now hardcoded -->
                </div>
                <button class="w-100 btn btn-primary btn-lg mt-4" type="submit">حفظ التعديلات</button>
                <a href="{{ url_for('api_configs_route') }}" class="btn btn-secondary btn-lg mt-2 w-100">إلغاء</a>
            </form>
        </div>
    </div>
{% endblock %}
